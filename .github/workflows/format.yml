name: format

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.4
      - name: Configure Composer auth for Filament
        env:
          FILAMENT_USERNAME: ${{ secrets.FILAMENT_USERNAME }}
          FILAMENT_LICENSE_KEY: ${{ secrets.FILAMENT_LICENSE_KEY }}
        run: composer config http-basic.packages.filamentphp.com "$FILAMENT_USERNAME" "$FILAMENT_LICENSE_KEY"
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-scripts
      - name: Check code style
        run: vendor/bin/pint --test
